name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip until Cloudflare secrets are added
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN isn't set yet, so nothing was deployed. Add it and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'

      # The site lives at the repo root (so GitHub Pages keeps working).
      # Copy only the public files into dist/ for Cloudflare.
      - name: Collect site files
        if: env.HAS_TOKEN == 'true'
        run: |
          mkdir -p dist
          find . -maxdepth 1 -mindepth 1 ! -name '.*' ! -name dist ! -name wrangler.jsonc ! -name README.md ! -name node_modules -exec cp -r {} dist/ \;
          ls -la dist

      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.165.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
